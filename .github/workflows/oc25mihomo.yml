name: Build 25.10 OpenClash with mihomo

on:
  schedule:
    - cron: "10 22 * * *"  # 北京时间早上 6 点 10 分
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Create OpenClash & openclash directory for git & apk
        run: mkdir -p OpenClash openclash-x86 openclash-a53
        
      - name: Checkout package branch to OpenClash directory
        uses: actions/checkout@v4
        with:
          repository: vernesong/OpenClash
          path: OpenClash
          ref: package
          
      - name: Copy latest openclash APK to openclash directory
        run: |
          cp OpenClash/master/*.apk openclash-x86
          cp OpenClash/master/*.apk openclash-a53

      - name: Get version info
        id: extract_version
        run: |
          first_line=$(head -n 1 OpenClash/master/version)
          echo "version=$first_line" >> $GITHUB_ENV

      - name: Create Meta directory for git
        run: mkdir Meta
      
      - name: Checkout core branch to Meta directory
        uses: actions/checkout@v4
        with:
          repository: tianxian88/mihomo
          path: Meta
          ref: main
      
      - name: list all cores on core branch
        run: ls Meta/bin/meta

      - name: Copy latest meta core to openclash directory
        run: |
          mv Meta/bin/meta/mihomo-linux-amd64-v1 openclash-x86/clash_meta
          mv Meta/bin/meta/mihomo-linux-arm64 openclash-a53/clash_meta

      # --------------------------------------------------------
      # 📥 下载 OpenClash 专属数据库组件并分发到两个架构目录
      # --------------------------------------------------------
      - name: Download OpenClash Database Files
        run: |
          echo "Current Path: $PWD"
          
          # 为 x86 架构下载数据库
          echo "📥 正在为 x86 下载 OpenClash 专属数据库组件..."
          mkdir -p openclash-x86/etc/openclash && cd openclash-x86/etc/openclash
          
          # [1/4] Country.mmdb
          wget -qO "Country.mmdb" "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/lite/Country.mmdb"
          [ -s "Country.mmdb" ] && echo "  ✅ Country.mmdb 下载成功！" || echo "  ❌ Country.mmdb 下载失败！"

          # [2/4] geoip.dat
          wget -qO "geoip.dat" "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
          [ -s "geoip.dat" ] && echo "  ✅ geoip.dat 下载成功！" || echo "  ❌ geoip.dat 下载失败！"

          # [3/4] geosite.dat
          wget -qO "geosite.dat" "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
          [ -s "geosite.dat" ] && echo "  ✅ geosite.dat 下载成功！" || echo "  ❌ geosite.dat 下载失败！"

          # [4/4] GeoLite2-ASN.mmdb
          wget -qO "GeoLite2-ASN.mmdb" "https://testingcf.jsdelivr.net/gh/xishang0128/geoip@release/GeoLite2-ASN.mmdb"
          [ -s "GeoLite2-ASN.mmdb" ] && echo "  ✅ GeoLite2-ASN.mmdb 下载成功！" || echo "  ❌ GeoLite2-ASN.mmdb 下载失败！"
          
          # 返回根目录并复制一份给 a53
          cd ../../../
          echo "📥 正在同步数据库文件到 a53 目录..."
          mkdir -p openclash-a53/etc/openclash
          cp -r openclash-x86/etc/openclash/* openclash-a53/etc/openclash/

      # --------------------------------------------------------
      # 🛠️ 生成安装脚本 (更新为自动移动数据库和内核)
      # --------------------------------------------------------
      - name: Create install.sh script save to openclash directory
        run: |
          cat << 'EOF' > openclash-x86/install.sh
          apk update
          if [ $? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          apk add --allow-untrusted *.apk || exit 1
          
          # 创建并移动核心和数据库
          mkdir -p /etc/openclash/core
          mv clash_meta /etc/openclash/core/
          
          # 如果包内带了etc/openclash的数据库，将其复制或同步过去
          if [ -d "etc/openclash" ]; then
              cp -rf etc/openclash/* /etc/openclash/
              echo "  ✅ OpenClash 数据库已成功安装至 /etc/openclash/"
          fi
          
          sleep 10s
          ifconfig br-lan > /dev/null 2>&1
          if [ $? -ne 0 ]; then
              echo "接口错误，重启网络。"
              /etc/init.d/network restart
              echo "重启完毕"
              exit 0
          fi
          EOF
          chmod +x openclash-x86/install.sh
          cp openclash-x86/install.sh openclash-a53/install.sh
          chmod +x openclash-a53/install.sh

      - name: Clone makeself repository for self-extracting installer
        run: | 
          git clone https://github.com/megastep/makeself.git

      - name: move openclash directory to makeself & create run
        run: |
          mv openclash-x86 makeself/
          mv openclash-a53 makeself/
          cd makeself
          ./makeself.sh openclash-x86/ 25-openclash-x86-64-${{ env.version }}.run "by github action" ./install.sh
          ./makeself.sh openclash-a53/ 25-openclash-aarch64_cortex-a53-${{ env.version }}.run "by github action" ./install.sh
      
      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            <p align="left">
             <img src="https://img.shields.io/github/downloads/wukongdaily/RunFilesBuilder/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
             <a href="https://wkdaily.cpolar.cn/archives/1">
               <img src="https://img.shields.io/badge/可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
             </a>
            </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
